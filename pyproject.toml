[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "mcp-hub"
dynamic = ["version"]
description = "MCP aggregator hub — lazy proxy, discovery, and CLI for child MCP servers"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  # Hard guard: PyPI/TestPyPI reject any upload carrying a "Private ::" classifier.
  # This package is distributed via Git + GitHub Releases, never PyPI.
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "click~=8.1",
  "keyring~=25.0",
  "mcp~=1.2",
  "python-dotenv~=1.0",
  "pyyaml~=6.0",
]

[project.scripts]
mcp-hub = "mcp_hub.cli:main"

[dependency-groups]
dev = [
  "pytest~=9.0",
  "pytest-asyncio~=1.0",
  # Three segments on purpose: a two-segment ~=0.16 would only cap at <1.0, and
  # pre-1.0 ruff minors promote lint rules and change formatter style. Keep this
  # minor in lockstep with the ruff-pre-commit `rev` in .pre-commit-config.yaml,
  # or CI's `ruff format --check` drifts from what the hook considers clean.
  "ruff~=0.16.0",
  "pre-commit~=4.0",
]

[tool.hatch.version]
path = "mcp_hub/__init__.py"

[tool.hatch.build.targets.wheel]
packages = [ "mcp_hub" ]

[tool.hatch.build.targets.sdist]
include = [ "/mcp_hub" ]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["mcp_hub", "tests"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
]
ignore = [
  "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.semantic_release]
commit_parser = "conventional"
allow_zero_version = true
tag_format = "v{version}"
version_variables = [
  "mcp_hub/__init__.py:__version__",
]
commit_message = "chore(release): v{version} [skip ci]"

[tool.semantic_release.changelog]
mode = "update"
exclude_commit_patterns = [
  '''Merge pull request.*''',
  '''chore\(deps\):.*''',
]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"
mask_initial_release = false

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.publish]
upload_to_vcs_release = true
dist_glob_patterns = ["dist/*"]
